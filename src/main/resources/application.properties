spring.application.name=diamond-bank
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/diamond_bank}
spring.datasource.username=${DATABASE_USER:diamond}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
