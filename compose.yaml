services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: diamond_bank
      POSTGRES_USER: diamond
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - diamond-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diamond -d diamond_bank"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://db:5432/diamond_bank
      DATABASE_USER: diamond
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  diamond-data:
